<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recruiter Mail Automation</title>
    <meta name="description"
        content="Send professional job application emails with your resume to recruiters in one click." />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📧</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <div class="logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                    <path d="M22 7l-10 7L2 7" />
                </svg>
            </div>
            <div>
                <h1 class="title">Recruiter Mail Automation</h1>
                <p class="subtitle">Send professional job applications in one click</p>
            </div>
        </header>

        <!-- Main Card -->
        <div class="card">

            <!-- Tabs: Single & Multiple only -->
            <nav class="tabs" role="tablist">
                <button class="tab active" data-tab="single" role="tab" aria-selected="true">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2L11 13" />
                        <path d="M22 2l-7 20-4-9-9-4 20-7z" />
                    </svg>
                    Single Email
                </button>
                <button class="tab" data-tab="multi" role="tab" aria-selected="false">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    Multiple Emails
                </button>
            </nav>

            <!-- ═════════════════════════════════════ -->
            <!-- PANEL 1: Single Email                 -->
            <!-- ═════════════════════════════════════ -->
            <section class="panel active" id="panel-single" role="tabpanel">
                <form id="single-form" autocomplete="off" novalidate>

                    <!-- Recruiter Email -->
                    <div class="field" id="field-email">
                        <label for="recruiter-email">Recruiter Email <span class="req">*</span></label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="2" />
                                <path d="M22 7l-10 7L2 7" />
                            </svg>
                            <input type="email" id="recruiter-email" name="recruiterEmail"
                                placeholder="recruiter@company.com" required />
                        </div>
                    </div>

                    <!-- Recruiter Name -->
                    <div class="field" id="field-name">
                        <label for="recruiter-name">Recruiter Name</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                            <input type="text" id="recruiter-name" name="recruiterName"
                                placeholder="e.g. Priya Sharma" />
                        </div>
                    </div>

                    <!-- Company Name -->
                    <div class="field" id="field-company">
                        <label for="company-name">Company Name</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                                <path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16" />
                            </svg>
                            <input type="text" id="company-name" name="companyName" placeholder="e.g. Google" />
                        </div>
                    </div>

                    <!-- Position -->
                    <div class="field" id="field-position">
                        <label for="position">Position Applying For</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z" />
                            </svg>
                            <input type="text" id="position" name="position" placeholder="e.g. Software Developer" />
                        </div>
                    </div>

                    <!-- Resume Upload -->
                    <div class="field" id="field-resume-single">
                        <label for="resume-single">Attach Resume <span class="req">*</span></label>
                        <div class="file-pick" id="file-pick-single">
                            <input type="file" id="resume-single" name="resume" accept=".pdf,.doc,.docx" hidden />
                            <button type="button" class="file-btn" id="file-btn-single">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
                                </svg>
                                Choose File
                            </button>
                            <span class="file-label" id="file-label-single">No file selected</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-send" id="btn-send-single">
                        <span class="btn-text">Send Application</span>
                        <span class="btn-loader"></span>
                        <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5">
                            <path d="M22 2L11 13" />
                            <path d="M22 2l-7 20-4-9-9-4 20-7z" />
                        </svg>
                    </button>
                </form>
                <div class="status" id="status-single" role="status" aria-live="polite"></div>
            </section>

            <!-- ═════════════════════════════════════ -->
            <!-- PANEL 2: Multiple Emails              -->
            <!-- ═════════════════════════════════════ -->
            <section class="panel" id="panel-multi" role="tabpanel">
                <form id="multi-form" autocomplete="off" novalidate>

                    <!-- Multiple Emails -->
                    <div class="field" id="field-multi-emails">
                        <label for="multi-emails">HR / Recruiter Emails <span class="req">*</span></label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" style="top:16px;transform:none">
                                <rect x="2" y="4" width="20" height="16" rx="2" />
                                <path d="M22 7l-10 7L2 7" />
                            </svg>
                            <textarea id="multi-emails" name="multiEmails"
                                placeholder="Enter emails — one per line or comma-separated&#10;&#10;hr@google.com&#10;jobs@meta.com&#10;careers@amazon.in"></textarea>
                        </div>
                        <p class="field-hint">Enter up to 10 emails, one per line or separated by commas</p>
                    </div>

                    <!-- Position -->
                    <div class="field">
                        <label for="multi-position">Position Applying For</label>
                        <div class="input-wrap">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z" />
                            </svg>
                            <input type="text" id="multi-position" name="position"
                                placeholder="e.g. Software Developer" />
                        </div>
                    </div>

                    <!-- Resume Upload -->
                    <div class="field" id="field-resume-multi">
                        <label for="resume-multi">Attach Resume <span class="req">*</span></label>
                        <div class="file-pick" id="file-pick-multi">
                            <input type="file" id="resume-multi" name="resume" accept=".pdf,.doc,.docx" hidden />
                            <button type="button" class="file-btn" id="file-btn-multi">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
                                </svg>
                                Choose File
                            </button>
                            <span class="file-label" id="file-label-multi">No file selected</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-send" id="btn-send-multi">
                        <span class="btn-text">Send to All</span>
                        <span class="btn-loader"></span>
                        <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5">
                            <path d="M22 2L11 13" />
                            <path d="M22 2l-7 20-4-9-9-4 20-7z" />
                        </svg>
                    </button>
                </form>
                <div class="status" id="status-multi" role="status" aria-live="polite"></div>
            </section>
        </div>

        <footer class="footer">
            <p>Built by <strong>Dhanush</strong> &middot; Recruiter Mail Automation v1.0</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
